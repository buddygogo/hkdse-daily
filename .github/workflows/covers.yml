# Make AI cover images (Gemini) for new articles, then rebuild the site.
# Runs whenever the daily routine pushes new content to archive.json.
# Needs the repository secret GEMINI_API_KEY (Settings → Secrets and variables → Actions).
# News-site photos are never used.

name: Make AI covers

on:
  push:
    branches: [main]
    paths: ['archive.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 anthropic google-genai python-dotenv pillow
      - name: Make missing covers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python make_covers.py
      - name: Rebuild site
        run: python generate.py --build
      - name: Commit
        run: |
          git config user.name  "HKDSE Covers Bot"
          git config user.email "actions@github.com"
          git add archive.json index.html a/ covers/
          git diff --staged --quiet && exit 0
          git commit -m "Add AI cover images"
          git pull --rebase
          git push
